
openapi: 3.0.0
info:
  version: 1.0.0
  title: Swagger ClientStore
  license:
    name: MIT

servers:
  - url: http://petstore.swagger.io/v1

paths:
  /client:
    get:
      summary: List all clients
      operationId: listClient
      tags:
        - client
      responses:
        '200':
          description: An array of clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clients'

    post:
      summary: Create a client
      operationId: createClient
      tags:
        - client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
        required: true
      responses:
        '201':
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /client/{clientId}:
    put:
      summary: Update client data
      operationId: updateClientById
      tags:
        - client
      parameters:
        - name: clientId
          in: path
          required: true
          description: The id of the client to update
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Client'
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '500':
          description: Error bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete client data
      operationId: deleteClientById
      tags:
        - client
      parameters:
        - name: clientId
          in: path
          required: true
          description: The id of the client to delete
          schema:
            type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '500':
          description: Error bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update first name of client
      operationId: patchClientById
      tags:
        - client
      parameters:
        - name: clientId
          in: path
          required: true
          description: The id of the client to update
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '500':
          description: Error bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Client:
      type: object
      required:
        - id
        - firstName
        - lastName
      properties:
        id:
          type: integer
          format: int64
          example: 12
        firstName:
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚñÑ ]+$'
          type: string
          example: Marco
        lastName:
          pattern: '^[a-zA-ZáéíóúÁÉÍÓÚñÑ ]+$'
          type: string
          example: Perez
        age:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          example: 25

    Clients:
      type: array
      maxItems: 100
      items:
        $ref: '#/components/schemas/Client'

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ERR2025
        message:
          type: string
          example: Error al ingresar informacion
